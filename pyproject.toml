[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "SeismoLab"
version = "0.1.0"
description = "Herramientas para preparar acelerogramas y calcular IMs 1D/2D"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SeismoLab Team" }]
dependencies = [
  "numpy>=1.25",
  "pandas>=2.0",
  "scipy>=1.10",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
  "pre-commit>=3.7",
]

[project.scripts]
imcalc = "SeismoLab.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/SeismoLab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
